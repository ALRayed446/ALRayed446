<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Al Rayed: physics, mathematics and code</title>
  <desc id="d">An animated terminal types: whoami, al rayed; cat about.txt, physics mathematics code; working with python, git, linux; learning C, latex, numerical methods; goal problem solver.</desc>
